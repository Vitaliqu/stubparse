name: Feature request
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Describe the change you have in mind. Rough is fine.
  - type: dropdown
    id: who
    attributes:
      label: You are a…
      options:
        - Bookkeeper, accountant, or payroll admin
        - Lender, landlord, or leasing agent
        - Individual
        - Developer self-hosting StubParse
        - Other
